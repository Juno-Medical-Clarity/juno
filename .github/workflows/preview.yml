name: Preview

# Deploys frontend-trial/ to a temporary Firebase Hosting preview channel for
# every pull request, so a reviewer gets a live link without needing a local
# build. Restricted to PRs whose head branch lives in this repository (not
# forks) because the deploy step needs the FIREBASE_SERVICE_ACCOUNT secret,
# which GitHub Actions never exposes to workflows triggered from a fork.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CHANNEL_ID: pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-trial/package-lock.json

      - name: Install trial dependencies
        run: npm ci
        working-directory: frontend-trial

      # Same build-time config as deploy.yml's "Build trial (frontend-trial/)"
      # step, so the preview points at the same production backend API and
      # Firebase project the live trial site uses.
      - name: Build trial (frontend-trial/)
        run: npm run build
        working-directory: frontend-trial
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_PROCESSING_URL: ${{ secrets.VITE_API_PROCESSING_URL }}
          VITE_DEFAULT_VERSION: v1-2
          VITE_GA_MEASUREMENT_ID: G-4R0CDYKSPW

      # Same auth mechanism deploy.yml's "Deploy to Firebase Hosting" step
      # uses: write the FIREBASE_SERVICE_ACCOUNT secret to a temp credentials
      # file and point firebase-tools at it via GOOGLE_APPLICATION_CREDENTIALS
      # — no marketplace action, no new secret.
      - name: Deploy preview channel (hosting:trial only)
        id: deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          creds_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds_file"

          set +e
          deploy_output=$(npx firebase-tools hosting:channel:deploy "$CHANNEL_ID" \
            --project juno-medical-clarity --only trial --expires 7d --json 2>&1)
          deploy_exit=$?
          set -e

          rm -f "$creds_file"
          echo "$deploy_output"

          if [ "$deploy_exit" -ne 0 ]; then
            exit "$deploy_exit"
          fi

          # firebase-tools' --json output nests the channel URL under
          # result.<target>.url; walk it with jq (preinstalled on GitHub's
          # ubuntu-latest runners) without hardcoding the target key, falling
          # back to a plain regex scan of the raw output in case the JSON
          # shape ever changes across firebase-tools versions.
          preview_url=$(echo "$deploy_output" | jq -r '
            if (.result | type) == "object" then
              [.result[] | select(.url != null) | .url][0] // empty
            else empty end
          ' 2>/dev/null)

          if [ -z "$preview_url" ] || [ "$preview_url" = "null" ]; then
            preview_url=$(echo "$deploy_output" \
              | grep -oE 'https://[a-zA-Z0-9.-]+\.web\.app[a-zA-Z0-9/_.-]*' \
              | head -n1)
          fi

          if [ -z "$preview_url" ]; then
            echo "::error::Could not extract a preview URL from firebase-tools output."
            exit 1
          fi

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          {
            echo "### Firebase Hosting preview"
            echo ""
            echo "**Channel:** \`$CHANNEL_ID\` (target: \`trial\`, expires in 7 days)"
            echo ""
            echo "**URL:** ${{ steps.deploy.outputs.preview_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          body="### 🔥 Trial preview deployed

          **URL:** $PREVIEW_URL

          Channel \`$CHANNEL_ID\` expires 7 days after the last deploy. This
          comment updates on every new push to this PR."

          gh pr comment "${{ github.event.number }}" \
            --repo "${{ github.repository }}" \
            --edit-last \
            --body "$body" \
            || gh pr comment "${{ github.event.number }}" \
              --repo "${{ github.repository }}" \
              --body "$body"
