name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: juno-medical-clarity
  GCP_REGION: us-central1
  GCP_BUCKET_NAME: juno-medical-clarity-backend
  PREVIEW_SERVICE: simplify-backend-pr-${{ github.event.pull_request.number }}
  PREVIEW_IMAGE: us-central1-docker.pkg.dev/juno-medical-clarity/juno/simplify-backend:pr-${{ github.event.pull_request.number }}

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          gcloud builds submit \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --config ./backend/cloudbuild.yaml \
            --substitutions "_BACKEND_IMAGE=${{ env.PREVIEW_IMAGE }}" \
            ./backend

      - name: Deploy preview to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.PREVIEW_SERVICE }}
          image: ${{ env.PREVIEW_IMAGE }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --allow-unauthenticated
            --memory 2Gi
            --timeout 300
          env_vars: |
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            GCP_BUCKET_NAME=${{ env.GCP_BUCKET_NAME }}
            GCP_LOCATION=${{ env.GCP_REGION }}
            VERTEX_AI_MODEL=gemini-3.5-flash
            SIMPLIFY_DEFAULT_VERSION=v1-2
            FIRESTORE_DATABASE_ID=(default)
          secrets: |
            FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest

      - name: Comment backend URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- backend-preview -->';
            const body = `${marker}\n**Backend preview:** ${{ steps.deploy.outputs.url }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      checks: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_PROCESSING_URL: ${{ needs.backend.outputs.url }}
          VITE_DEFAULT_VERSION: v1-2

      - name: Deploy frontend preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: juno-medical-clarity
          entryPoint: ./frontend
          expires: 7d
