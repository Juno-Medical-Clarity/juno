name: Deploy Backend

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: juno-medical-clarity
      GCP_REGION: us-central1
      GCP_BUCKET_NAME: juno-medical-clarity-backend
      BACKEND_IMAGE: us-central1-docker.pkg.dev/juno-medical-clarity/juno/simplify-backend
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Select backend GCP project
        run: gcloud config set project "$GCP_PROJECT_ID"

      - name: Build, push, and deploy juno-api + juno-worker
        run: |
          gcloud builds submit \
            --project "$GCP_PROJECT_ID" \
            --config ./backend/cloudbuild.yaml \
            --substitutions "_BACKEND_IMAGE=$BACKEND_IMAGE,_REGION=$GCP_REGION" \
            ./backend

      - name: Configure juno-api env vars and secrets
        run: |
          WORKER_URL=$(gcloud run services describe juno-worker \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
            --format='value(status.url)')

          gcloud run services update juno-api \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --memory 2Gi \
            --timeout 300 \
            --set-env-vars "\
GCP_PROJECT_ID=$GCP_PROJECT_ID,\
GCP_BUCKET_NAME=$GCP_BUCKET_NAME,\
GCP_LOCATION=$GCP_REGION,\
VERTEX_AI_MODEL=gemini-3.5-flash,\
SIMPLIFY_DEFAULT_VERSION=v1-2,\
FIRESTORE_DATABASE_ID=(default),\
CLOUD_TASKS_QUEUE=projects/$GCP_PROJECT_ID/locations/$GCP_REGION/queues/care-plan-jobs,\
WORKER_URL=$WORKER_URL,\
WORKER_SERVICE_ACCOUNT=juno-worker-invoker@$GCP_PROJECT_ID.iam.gserviceaccount.com,\
JOB_TIMEOUT_SECONDS_SINGLE=300,\
JOB_TIMEOUT_SECONDS_BATCH=900" \
            --set-secrets "FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest"

      - name: Configure juno-worker env vars and secrets
        run: |
          gcloud run services update juno-worker \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --memory 2Gi \
            --timeout 900 \
            --set-env-vars "\
GCP_PROJECT_ID=$GCP_PROJECT_ID,\
GCP_BUCKET_NAME=$GCP_BUCKET_NAME,\
GCP_LOCATION=$GCP_REGION,\
VERTEX_AI_MODEL=gemini-3.5-flash,\
SIMPLIFY_DEFAULT_VERSION=v1-2,\
FIRESTORE_DATABASE_ID=(default)" \
            --set-secrets "FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest"
