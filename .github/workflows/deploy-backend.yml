name: Deploy Backend

on:
  push:
    branches: [deploy]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          gcloud builds submit \
            --tag gcr.io/juno-499419/simplify-backend \
            ./backend

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: simplify-backend
          image: gcr.io/juno-499419/simplify-backend
          region: us-central1
          flags: >-
            --allow-unauthenticated
            --memory 2Gi
            --timeout 300
          env_vars: |
            GCP_PROJECT_ID=juno-499419
            GCP_BUCKET_NAME=juno-test-bucket
            GCP_LOCATION=us-central1
            VERTEX_AI_MODEL=gemini-3.5-flash
            SIMPLIFY_DEFAULT_VERSION=v1-2
            FIRESTORE_DATABASE_ID=(default)
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          secrets: |
            FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest
