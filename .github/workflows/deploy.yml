name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  statuses: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: juno-medical-clarity
      GCP_REGION: us-central1
      GCP_BUCKET_NAME: juno-medical-clarity-backend
      BACKEND_IMAGE: us-central1-docker.pkg.dev/juno-medical-clarity/juno/simplify-backend
      API_MAX_INSTANCES: "10"
      WORKER_MAX_INSTANCES: "5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Select backend GCP project
        run: gcloud config set project "$GCP_PROJECT_ID"

      - name: Copy preset-data into backend build context
        run: cp -r preset-data backend/preset-data

      - name: Build, push, and deploy juno-api + juno-worker
        run: |
          gcloud builds submit \
            --project "$GCP_PROJECT_ID" \
            --config ./backend/cloudbuild.yaml \
            --substitutions "_BACKEND_IMAGE=$BACKEND_IMAGE,_REGION=$GCP_REGION" \
            ./backend

      - name: Ensure trial Cloud Tasks queue exists
        run: |
          gcloud tasks queues create care-plan-jobs-trial \
            --location "$GCP_REGION" --project "$GCP_PROJECT_ID" \
            --max-concurrent-dispatches=5 --max-dispatches-per-second=2 \
            || echo "queue already exists — continuing"

      - name: Configure juno-api env vars and secrets
        run: |
          WORKER_URL=$(gcloud run services describe juno-worker \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
            --format='value(status.url)')

          API_ENV_VARS="GCP_PROJECT_ID=$GCP_PROJECT_ID,GCP_BUCKET_NAME=$GCP_BUCKET_NAME,GCP_LOCATION=global,VERTEX_AI_MODEL=gemini-3.5-flash,SIMPLIFY_DEFAULT_VERSION=v1-2,FIRESTORE_DATABASE_ID=(default),CLOUD_TASKS_QUEUE=projects/$GCP_PROJECT_ID/locations/$GCP_REGION/queues/care-plan-jobs,WORKER_URL=$WORKER_URL,WORKER_SERVICE_ACCOUNT=juno-worker-invoker@$GCP_PROJECT_ID.iam.gserviceaccount.com,JOB_TIMEOUT_SECONDS_SINGLE=300,JOB_TIMEOUT_SECONDS_BATCH=900,CLOUD_TASKS_QUEUE_TRIAL=projects/$GCP_PROJECT_ID/locations/$GCP_REGION/queues/care-plan-jobs-trial,TRIAL_RATE_LIMIT_SALT=${{ secrets.TRIAL_RATE_LIMIT_SALT }}"

          gcloud run services update juno-api \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --memory 2Gi \
            --timeout 300 \
            --max-instances "$API_MAX_INSTANCES" \
            --set-env-vars "$API_ENV_VARS" \
            --set-secrets "FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest"

      - name: Configure juno-worker env vars and secrets
        run: |
          WORKER_ENV_VARS="GCP_PROJECT_ID=$GCP_PROJECT_ID,GCP_BUCKET_NAME=$GCP_BUCKET_NAME,GCP_LOCATION=global,VERTEX_AI_MODEL=gemini-3.5-flash,SIMPLIFY_DEFAULT_VERSION=v1-2,FIRESTORE_DATABASE_ID=(default),WORKER_SERVICE_ACCOUNT=juno-worker-invoker@$GCP_PROJECT_ID.iam.gserviceaccount.com,JUNO_MODE=worker"

          gcloud run services update juno-worker \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --memory 2Gi \
            --timeout 900 \
            --max-instances "$WORKER_MAX_INSTANCES" \
            --set-env-vars "$WORKER_ENV_VARS" \
            --set-secrets "FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest,ATHENA_HEALTH_TEST_CLIENT_ID=athena-health-test-client-id:latest,ATHENA_HEALTH_TEST_CLIENT_SECRET=athena-health-test-client-secret:latest"

      - name: Deploy anonymous-user-cleanup Cloud Run Job
        run: |
          gcloud run jobs deploy juno-trial-anon-cleanup \
            --image="$BACKEND_IMAGE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --command=python \
            --args="-m,scripts.cleanup_anonymous_users" \
            --update-env-vars="GCP_PROJECT_ID=$GCP_PROJECT_ID,FIRESTORE_DATABASE_ID=(default)" \
            --update-secrets="FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest" \
            --task-timeout=1800 \
            --max-retries=0 \
            --memory=512Mi \
            --cpu=1

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-trial/package-lock.json

      # Always installed, even on the automatic workflow_run path where the
      # app target itself is never built/deployed below: frontend-trial's
      # tsconfig maps @main/* to ../frontend/src (its shared-component alias),
      # and tsc resolves those files' own `react`/`react-dom` imports against
      # frontend/node_modules — without it, "Build trial (frontend-trial/)"
      # fails with "Cannot find module 'react'" on every automatic deploy.
      - name: Install app dependencies
        run: npm ci
        working-directory: frontend

      - name: Build app (frontend/)
        if: github.event_name == 'workflow_dispatch'
        run: npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_PROCESSING_URL: ${{ secrets.VITE_API_PROCESSING_URL }}
          VITE_DEFAULT_VERSION: v1-2

      - name: Install trial dependencies
        run: npm ci
        working-directory: frontend-trial

      - name: Build trial (frontend-trial/)
        run: npm run build
        working-directory: frontend-trial
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_PROCESSING_URL: ${{ secrets.VITE_API_PROCESSING_URL }}
          VITE_DEFAULT_VERSION: v1-2
          VITE_GA_MEASUREMENT_ID: G-4R0CDYKSPW

      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          creds_file="$RUNNER_TEMP/firebase-service-account-rules.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds_file"
          trap 'rm -f "$creds_file"' EXIT

          npx firebase-tools deploy --only firestore:rules \
            --project juno-medical-clarity --non-interactive

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          creds_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds_file"

          deploy_target() {
            local target="$1"
            set +e
            deploy_output=$(npx firebase-tools deploy --only "hosting:$target" \
              --project juno-medical-clarity --non-interactive 2>&1)
            deploy_exit=$?
            set -e
            echo "$deploy_output"
            if [ "$deploy_exit" -ne 0 ]; then
              if echo "$deploy_output" | grep -q "is the current active version"; then
                echo "::warning::hosting:$target build is identical to the current live version; nothing to release. Treating this no-op deploy as success."
                return 0
              fi
              return "$deploy_exit"
            fi
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            deploy_target app
          fi
          deploy_target trial

          rm -f "$creds_file"

  tag:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Tag production deploy
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          git fetch --tags origin
          existing_tag=$(git tag --points-at "$HEAD_SHA" 'prod-*' | head -n 1)
          if [[ -n "$existing_tag" ]]; then
            echo "Production tag already exists for $HEAD_SHA: $existing_tag"
            exit 0
          fi

          tag_name="prod-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag_name" "$HEAD_SHA" -m "Production deploy $tag_name"
          git push origin "$tag_name"
          echo "Created production tag $tag_name for $HEAD_SHA"
