name: Deploy

on:
  workflow_dispatch:
    branches: [main]

permissions:
  contents: write
  checks: write
  statuses: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: juno-medical-clarity
      GCP_REGION: us-central1
      GCP_BUCKET_NAME: juno-medical-clarity-backend
      BACKEND_IMAGE: us-central1-docker.pkg.dev/juno-medical-clarity/juno/simplify-backend
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Select backend GCP project
        run: gcloud config set project "$GCP_PROJECT_ID"

      - name: Copy preset-data into backend build context
        run: cp -r preset-data backend/preset-data

      - name: Build, push, and deploy juno-api + juno-worker
        run: |
          gcloud builds submit \
            --project "$GCP_PROJECT_ID" \
            --config ./backend/cloudbuild.yaml \
            --substitutions "_BACKEND_IMAGE=$BACKEND_IMAGE,_REGION=$GCP_REGION" \
            ./backend

      - name: Configure juno-api env vars and secrets
        run: |
          WORKER_URL=$(gcloud run services describe juno-worker \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
            --format='value(status.url)')

          API_ENV_VARS="GCP_PROJECT_ID=$GCP_PROJECT_ID,GCP_BUCKET_NAME=$GCP_BUCKET_NAME,GCP_LOCATION=global,VERTEX_AI_MODEL=gemini-3.5-flash,SIMPLIFY_DEFAULT_VERSION=v1-2,FIRESTORE_DATABASE_ID=(default),CLOUD_TASKS_QUEUE=projects/$GCP_PROJECT_ID/locations/$GCP_REGION/queues/care-plan-jobs,WORKER_URL=$WORKER_URL,WORKER_SERVICE_ACCOUNT=juno-worker-invoker@$GCP_PROJECT_ID.iam.gserviceaccount.com,JOB_TIMEOUT_SECONDS_SINGLE=300,JOB_TIMEOUT_SECONDS_BATCH=900"

          gcloud run services update juno-api \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --memory 2Gi \
            --timeout 300 \
            --set-env-vars "$API_ENV_VARS" \
            --set-secrets "FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest"

      - name: Configure juno-worker env vars and secrets
        run: |
          WORKER_ENV_VARS="GCP_PROJECT_ID=$GCP_PROJECT_ID,GCP_BUCKET_NAME=$GCP_BUCKET_NAME,GCP_LOCATION=global,VERTEX_AI_MODEL=gemini-3.5-flash,SIMPLIFY_DEFAULT_VERSION=v1-2,FIRESTORE_DATABASE_ID=(default),WORKER_SERVICE_ACCOUNT=juno-worker-invoker@$GCP_PROJECT_ID.iam.gserviceaccount.com,JUNO_MODE=worker"

          gcloud run services update juno-worker \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --memory 2Gi \
            --timeout 900 \
            --set-env-vars "$WORKER_ENV_VARS" \
            --set-secrets "FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest,ATHENA_HEALTH_TEST_CLIENT_ID=athena-health-test-client-id:latest,ATHENA_HEALTH_TEST_CLIENT_SECRET=athena-health-test-client-secret:latest"

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_PROCESSING_URL: ${{ secrets.VITE_API_PROCESSING_URL }}
          VITE_DEFAULT_VERSION: v1-2

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: juno-medical-clarity
          channelId: live
          entryPoint: ./frontend

  tag:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag production deploy
        run: |
          HEAD_SHA="${{ github.sha }}"

          git fetch --tags origin
          existing_tag=$(git tag --points-at "$HEAD_SHA" 'prod-*' | head -n 1)
          if [[ -n "$existing_tag" ]]; then
            echo "Production tag already exists for $HEAD_SHA: $existing_tag"
            exit 0
          fi

          tag_name="prod-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag_name" "$HEAD_SHA" -m "Production deploy $tag_name"
          git push origin "$tag_name"
          echo "Created production tag $tag_name for $HEAD_SHA"
