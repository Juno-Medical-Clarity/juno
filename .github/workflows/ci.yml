name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: test-project
      GCP_LOCATION: us-central1
      FIRESTORE_DATABASE_ID: "(default)"
      SIMPLIFY_DEFAULT_VERSION: v1-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff lint
        working-directory: backend
        run: ruff check . --config pyproject.toml

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

  frontend-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-trial/package-lock.json

      # frontend-trial's @main/* alias resolves to ../frontend/src (its
      # shared-component surface: CarePlanView, MedicalTerm, buildPdfHtml,
      # types/), and both Vitest and tsc resolve those files' own
      # react/react-dom imports against frontend/node_modules — without it,
      # every test/build touching an aliased import fails to resolve
      # react/jsx-dev-runtime. Matches the same fix in deploy.yml/preview.yml.
      - name: Install app dependencies (for the @main alias)
        run: npm ci
        working-directory: frontend

      - name: Install dependencies
        run: npm ci
        working-directory: frontend-trial

      - name: Run frontend-trial tests
        run: npm run test
        working-directory: frontend-trial
